<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus AI - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(11, 17, 32, 0.85);
            --input-bg: #111827;
            --input-border: #1f293d;
            --accent-cyan: #00b2ff;
            --accent-blue: #0055ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* Starry Dust Canvas background */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            padding: 2.5rem 2.25rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 178, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .brand-icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.5);
            color: #ffffff;
            font-size: 28px;
        }

        .title {
            font-weight: 700;
            letter-spacing: -0.5px;
            font-size: 1.6rem;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.825rem;
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .architecture-badge {
            background: rgba(0, 178, 255, 0.08);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 178, 255, 0.25);
            font-size: 0.725rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1.75rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .form-label {
            font-size: 0.825rem;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-right: none;
            color: var(--text-muted);
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-left: none;
            color: var(--text-main);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            padding: 0.7rem 0.9rem;
            font-size: 0.9rem;
        }

        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--accent-cyan);
            color: var(--text-main);
            box-shadow: none;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .form-control::placeholder {
            color: #4b5563;
        }

        .btn-launch {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            padding: 0.8rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            margin-top: 1rem;
        }

        .btn-launch:hover {
            box-shadow: 0 6px 25px rgba(0, 198, 255, 0.6);
            transform: translateY(-1px);
            color: #fff;
        }

        .alert-danger-custom {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 0.825rem;
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>

    <!-- Starry Dust Background Effect -->
    <canvas id="stars-canvas"></canvas>

    <div class="login-card text-center">
        <!-- Main Icon -->
        <div class="brand-icon-wrapper">
            <div class="brand-icon">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
        </div>

        <div class="title">Smart Campus AI</div>
        <div class="subtitle">
            Integrated Multi-Agent RAG Architecture<br>
            <span style="color: #6b7280; font-size: 0.75rem;">Autonomous Multi-LLM Problem Solving</span>
        </div>

        <div>
            <span class="architecture-badge">
                <span class="status-dot"></span> Multi-Agent Network Ready
            </span>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert-danger-custom text-start">
                <i class="fa-solid fa-circle-exclamation me-1"></i> {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Form -->
        <form method="POST" action="/login" class="text-start">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autocomplete="off">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="admin123" required>
                </div>
            </div>

            <button type="submit" class="btn btn-launch">
                Launch System <i class="fa-solid fa-arrow-right ms-1"></i>
            </button>
        </form>
    </div>

    <!-- Starry Night Background Animation Script -->
    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Generate particle dust/stars
        const numStars = 150;
        const stars = [];

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.015 + 0.005,
                dir: Math.random() < 0.5 ? 1 : -1
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);

            stars.forEach(star => {
                // Twinkle effect
                star.alpha += star.speed * star.dir;
                if (star.alpha >= 1 || star.alpha <= 0.1) {
                    star.dir *= -1;
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#00b2ff';
                ctx.fill();
            });

            requestAnimationFrame(drawStars);
        }

        drawStars();
    </script>
</body>
</html>
