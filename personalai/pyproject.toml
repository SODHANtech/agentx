[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personalai"
version = "0.1.0"
description = "Production-grade, zero-leak personal AI system with cross-platform automation, RAG, and MCP"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Personal AI Architecture Team" }
]
dependencies = [
    "google-antigravity>=0.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "httpx>=0.24.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pure-python-adb>=0.3.0.dev0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
personalai = "personalai.cli:app"

[tool.setuptools.packages.find]
where = ["."]
